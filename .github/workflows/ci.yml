name: ci

# CI：只跑 vet + 测试，不构建产物、不发布 Release / 镜像。
#   - push main / PR / 手动触发 → go vet + go test
#
# 版本号约定：cmd/server/main.go 的 appVersion 是唯一版本源；v* tag 仅作版本标记，
# 不触发 CI、不创建 Release、不发布镜像。
on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 同一 ref 的旧运行被新运行取消，避免排队白占额度。
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go vet ./...
      - run: go test ./... -count=1


